version: 1
name: connskill-growth-services
displayName: CONNSKILL Growth Services
description: Local market checks, domain rankings and keyword research as JSON for AI agents. Free recipes and quotes precede approved x402 calls in USDC on Base; tools follow live discovery.
category: data
tags:
  - seo
  - x402
  - ai-agents
  - data
  - usdc
homepage: https://agent.connskill.com
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      X402_WALLET_KEY:
        type: string
        title: Base wallet private key
        description: Private key of a Base wallet holding USDC. Enables paid calls. Leave empty for free endpoints only. Use a dedicated wallet.
      X402_MAX_USD:
        type: string
        default: "1.00"
        description: Hard cap per paid call, in USD.
    required: []
  commandFunction: |
    (config) => ({
      command: 'node',
      args: ['index.mjs'],
      env: {
        X402_WALLET_KEY: config.X402_WALLET_KEY || '',
        X402_MAX_USD: config.X402_MAX_USD ?? '1.00'
      }
    })
